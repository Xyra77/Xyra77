name: Update Monthly Language Card

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/monthly-language.svg"

  schedule:
    - cron: "17 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate monthly language card
        env:
          GH_USERNAME: Xyra77
        run: |
          python .github/scripts/monthly_language.py

      - name: Commit card if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/monthly-language.svg

          if ! git diff --cached --quiet; then
            git commit -m "chore: update monthly language card"
            git push
          else
            echo "Monthly language card unchanged."
          fi
