name: Update Trophy Card

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trophy.yml"
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download trophy card
        env:
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          URL="https://github-profile-trophy.vercel.app/?username=${GH_USERNAME}&theme=radical&no-bg=true&no-frame=true&row=2&column=6&margin-w=12&margin-h=12"
          curl --fail --silent --show-error --location \
            --max-time 60 --retry 6 --retry-delay 10 --retry-all-errors \
            -o /tmp/trophy.svg "$URL"
          grep -q "<svg" /tmp/trophy.svg
          mv /tmp/trophy.svg assets/trophy.svg

      - name: Commit card if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophy.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update trophy card"
            git pull --rebase
            git push
          else
            echo "Trophy card unchanged."
          fi
